# USB sound card. With onboard audio disabled this should be card 0.
# Confirm on hardware with: aplay -l
ADEVICE plughw:0,0
ARATE 48000
ACHANNELS 1

CHANNEL 0
MYCALL MB7UJM
MODEM 1200

# BCM GPIO 25 is physical header pin 22, chosen because GPIO 9-27 default to
# a pull-down at power-on while GPIO 0-8 default to a pull-up: a pin from the
# high group would key the transmitter before Linux had even booted. 25 also
# sits next to a ground pin, and avoids the I2C, SPI, PWM and UART functions
# (the serial console is on 14/15).
#
# The internal pull-down is only ~50k and the line is high impedance until
# Dire Wolf claims it, so the interface carries its own pull-down to ground to
# keep the radio unkeyed during boot, during a restart, and if Dire Wolf dies.
# Prefix the line number with "-" if the interface turns out to be active-low.
PTT GPIOD gpiochip0 25

# 1200-baud VHF timing. TXDELAY is 600 ms of preamble before the data: a
# commercial mobile has a relay and a synthesiser to settle, and is generally
# slower to reach full output than an amateur set. If the data starts before
# the transmitter is up, the opening flags are lost and nothing decodes, while
# the burst still sounds perfectly normal on a nearby receiver.
TXDELAY 60
TXTAIL 10
SLOTTIME 10
PERSIST 63

# APRS-IS login passcodes are derived from the callsign and are not secrets.
IGSERVER euro.aprs2.net
IGLOGIN MB7UJM 17336

# This starts as a receive-only iGate: RF packets are uploaded to APRS-IS,
# but Internet traffic is not transmitted. Before enabling two-way gating,
# add an appropriate IGFILTER and an IGTXVIA line matching the NoV and local
# APRS coordination.

# Announce the station to APRS-IS so it appears on aprs.fi and friends.
#
# "sendto=IG" delivers this straight to the APRS-IS server rather than the
# transmit queue, so nothing is keyed on RF. That keeps the beacon clear of
# the NoV transmit conditions and means it works with no PTT hardware.
#
# Position is the licensed site at Fordham, from the 10-character Maidenhead
# locator JO02EH84SS, which resolves the antenna to about 19 x 24 metres.
# ETCC records the site as JO02EH / 52.31 / 0.41, which agrees to within the
# ~1 km implied by its two decimal places:
# https://ukrepeater.net/my_repeater.php?id=6931
#
# Overlay R on the "&" symbol is the receive-only iGate symbol. Change it to
# overlay I once this station also gates Internet traffic back to RF.
#
# Note: the config parser reads one line at a time with no continuation
# support, so this has to stay on a single line however long it gets.
PBEACON sendto=IG delay=0:30 every=30 overlay=R symbol="igate" lat=52.311545 long=0.406424 comment="Fordham JO02EH - APRS iGate - Dire Wolf on Pi Zero 2 W"

# The same position radiated on RF, so stations without an Internet feed can
# see the gateway. This is the only thing the station transmits: Internet
# traffic is still not gated back to RF (see IGTXVIA above).
#
# WIDE2-1 asks for a single digipeat. Beyond announcing the station a little
# further, it doubles as the transmit self-test: when a neighbouring digi
# repeats the beacon, this station decodes its own callsign coming back, which
# confirms PTT timing, TXDELAY and the transmit audio level in one go. Drop
# the path to beacon direct once the transmit chain is known good.
#
# 30 minutes is the usual interval for a fixed site. The offset delay keeps it
# clear of the APRS-IS beacon above rather than firing both at once.
#
# DISABLED pending confirmation of what channel 2 actually transmits on.
#
# The beacon was tried at three audio levels spanning 20 dB and at TXDELAY 30
# and 60. Not one transmission was received by any station: every MB7UJM
# packet on APRS-IS arrived as "TCPIP*,qAC", i.e. our own Internet beacon,
# with no digipeater path and no qAR from another gateway. Meanwhile this
# station hears MB7UPI and MB7UKR digipeating other traffic constantly, so
# there is no shortage of stations that would have repeated it.
#
# Transmitting is therefore doing nothing useful, and since channel 2 is only
# proven to *receive* 144.800 -- commercial sets are routinely programmed with
# split TX/RX -- an unattended 25 W carrier every 30 minutes on an unverified
# frequency is not something to leave running. A handheld a few metres away
# hearing it proves very little: that much RF will break into a nearby front
# end from an adjacent channel.
#
# Re-enable once the radio side is confirmed: channel 2's transmit frequency,
# the deviation, and the power setting.
#
# Note that nothing is known about the transmit frequency or deviation: this
# is an ex-commercial Tait, and both are set in its programming rather than
# anywhere reachable from here. Narrow-band 2.5 kHz deviation is the normal
# commercial default and will not carry 1200-baud APRS well at any audio
# level. Split TX/RX is equally routine.
#
# Total failure rather than degraded performance is the useful clue. Wrong
# deviation or low power would cost marginal decodes, not all of them: a
# digipeater heard here at level 60 would still catch some. Hearing nothing
# at all, ever, points to something binary, and transmitting on a different
# frequency to the one being received on is the obvious candidate.
# PBEACON delay=1 every=30 via=WIDE2-1 overlay=R symbol="igate" lat=52.311545 long=0.406424 comment="Fordham JO02EH - APRS iGate - Dire Wolf on Pi Zero 2 W"

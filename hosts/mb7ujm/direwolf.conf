# USB sound card. With onboard audio disabled this should be card 0.
# Confirm on hardware with: aplay -l
ADEVICE plughw:0,0
ARATE 48000
ACHANNELS 1

CHANNEL 0
MYCALL MB7UJM
MODEM 1200

# BCM GPIO 25 is physical header pin 22, chosen because GPIO 9-27 default to
# a pull-down at power-on while GPIO 0-8 default to a pull-up: a pin from the
# high group would key the transmitter before Linux had even booted. 25 also
# sits next to a ground pin, and avoids the I2C, SPI, PWM and UART functions
# (the serial console is on 14/15).
#
# The internal pull-down is only ~50k and the line is high impedance until
# Dire Wolf claims it, so the interface carries its own pull-down to ground to
# keep the radio unkeyed during boot, during a restart, and if Dire Wolf dies.
# Prefix the line number with "-" if the interface turns out to be active-low.
PTT GPIOD gpiochip0 25

# Conservative 1200-baud VHF timing defaults. Tune TXDELAY on-air.
TXDELAY 30
TXTAIL 10
SLOTTIME 10
PERSIST 63

# APRS-IS login passcodes are derived from the callsign and are not secrets.
IGSERVER euro.aprs2.net
IGLOGIN MB7UJM 17336

# This starts as a receive-only iGate: RF packets are uploaded to APRS-IS,
# but Internet traffic is not transmitted. Before enabling two-way gating,
# add an appropriate IGFILTER and an IGTXVIA line matching the NoV and local
# APRS coordination.

# Announce the station to APRS-IS so it appears on aprs.fi and friends.
#
# "sendto=IG" delivers this straight to the APRS-IS server rather than the
# transmit queue, so nothing is keyed on RF. That keeps the beacon clear of
# the NoV transmit conditions and means it works with no PTT hardware.
#
# Position is the licensed site at Fordham, from the 10-character Maidenhead
# locator JO02EH84SS, which resolves the antenna to about 19 x 24 metres.
# ETCC records the site as JO02EH / 52.31 / 0.41, which agrees to within the
# ~1 km implied by its two decimal places:
# https://ukrepeater.net/my_repeater.php?id=6931
#
# Overlay R on the "&" symbol is the receive-only iGate symbol. Change it to
# overlay I once this station also gates Internet traffic back to RF.
#
# Note: the config parser reads one line at a time with no continuation
# support, so this has to stay on a single line however long it gets.
PBEACON sendto=IG delay=0:30 every=30 overlay=R symbol="igate" lat=52.311545 long=0.406424 comment="Fordham JO02EH - APRS iGate - Dire Wolf on Pi Zero 2 W"
